<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>指尖花开 · 手势控制绽放</title>
<link rel="icon" href="data:," />
<style>
  :root{
    --teal:#7fd6c4; --pink:#ff9ec4;
    --ink:#eef7f4;
    --shadow:0 0 34px rgba(150,215,205,.13);
    --serif:"Songti SC","STSong","SimSun","Noto Serif SC","Times New Roman",serif;
    --kai:"Kaiti SC","STKaiti",KaiTi,"楷体","Songti SC",serif;
    --latin:Didot,"Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
    --sans:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans);
    background:radial-gradient(120% 120% at 50% 16%, #10313a 0%, #0a1a20 44%, #05080a 100%);
    color:var(--ink); overflow:hidden; user-select:none; -webkit-user-select:none;
  }

  /* ============ 顶部题名 ============ */
  .brand{position:fixed; left:clamp(24px,5vw,92px); top:clamp(20px,3.2vh,34px); z-index:6;
    font-family:var(--serif); font-size:14px; letter-spacing:.30em; font-weight:400;
    color:rgba(238,247,244,.34);}
  .brand small{display:block; font-family:var(--sans); font-size:8.5px; letter-spacing:.44em;
    color:rgba(238,247,244,.18); margin-top:7px;}

  /* ============ 主舞台：花是唯一主角 ============ */
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:2;}
  .flower-wrap{position:relative; height:min(78vh, max(220px, calc((100vw - 700px) * 0.5625)));
    max-height:78vh; aspect-ratio:16/9;
    border-radius:16px; overflow:hidden;
    box-shadow:0 0 110px rgba(120,200,210,.14), 0 10px 46px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.045); background:#04100f;}
  #flowerCanvas{width:100%; height:100%; display:block; background:#04100f;}
  #flowerFallback{width:100%; height:100%; object-fit:contain; display:none; background:#04100f;}
  .vignette{position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 92% at 50% 50%, transparent 56%, rgba(0,0,0,.42) 100%);}

  /* ============================================================
     左侧题款：细线小标 → 大字题句 → 小字注      （版式参「BLOOM / 01」）
     ============================================================ */
  .side-left{position:fixed; left:clamp(24px,5vw,92px); top:50%; transform:translateY(-50%);
    z-index:6; pointer-events:none; max-width:min(32vw,360px);}

  .kicker{display:flex; align-items:center; gap:13px; margin-bottom:clamp(15px,2.3vh,26px);}
  .kicker i{display:block; width:clamp(24px,2.6vw,42px); height:1px; flex:none;
    background:linear-gradient(90deg, rgba(238,247,244,.02), rgba(238,247,244,.44));}
  .kicker span{font-family:var(--sans); font-size:9.5px; letter-spacing:.40em;
    text-transform:uppercase; color:rgba(238,247,244,.34); white-space:nowrap;}

  .poem{font-family:var(--serif); font-weight:400;
    font-size:clamp(28px,3.0vw,45px); line-height:1.56; letter-spacing:.16em;
    color:rgba(240,249,246,.84); text-shadow:var(--shadow);}
  .poem .l{display:block;}
  .poem .l + .l{color:rgba(255,241,246,.90);}

  .poem-sub{margin-top:clamp(13px,2vh,22px);
    font-family:var(--kai); font-size:12.5px; letter-spacing:.30em;
    color:rgba(238,247,244,.40); white-space:nowrap;}

  .seal{width:25px; height:25px; margin-top:clamp(14px,2.2vh,24px); border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(174,56,44,.50); color:rgba(255,242,237,.86);
    font-family:var(--kai); font-size:12.5px; line-height:1;
    transform:rotate(-2.5deg); box-shadow:0 0 16px rgba(174,56,44,.15);}

  /* ============================================================
     右侧题识：序号 → 中文名 → 英文名 → 细线 → FLOWER LANGUAGE → 寓意
     ============================================================ */
  .side-right{position:fixed; right:clamp(24px,5vw,92px); top:50%; transform:translateY(-50%);
    z-index:6; pointer-events:none; text-align:left;}

  .r-idx{font-family:var(--latin); font-style:italic; font-size:11.5px; letter-spacing:.14em;
    color:rgba(238,247,244,.32);}
  .r-cn{font-family:var(--serif); font-size:14.5px; letter-spacing:.36em;
    color:rgba(238,247,244,.60); margin-top:10px;}
  .r-en{font-family:var(--latin); font-size:clamp(17px,1.5vw,23px); letter-spacing:.26em;
    text-transform:uppercase; color:rgba(242,250,247,.84); margin-top:7px;
    text-shadow:var(--shadow);}
  .r-lat{font-family:var(--latin); font-style:italic; font-size:11px; letter-spacing:.10em;
    color:rgba(238,247,244,.32); margin-top:9px;}

  .r-rule{width:58px; height:1px; margin:20px 0 18px;
    background:linear-gradient(90deg, rgba(238,247,244,.34), rgba(238,247,244,0));}

  .r-label{font-family:var(--sans); font-size:8.5px; letter-spacing:.46em;
    text-transform:uppercase; color:rgba(127,214,196,.50); margin-bottom:12px;}
  .r-mean{font-family:var(--kai); font-size:13px; letter-spacing:.18em; line-height:2.1;
    color:rgba(238,247,244,.54);}
  .r-tags{margin-top:11px; font-family:var(--sans); font-size:9.5px; letter-spacing:.30em;
    color:rgba(238,247,244,.30);}

  /* ============ 摄像头小窗（右下一隅） ============ */
  .cam{position:fixed; right:clamp(20px,2.4vw,40px); bottom:64px; width:230px; height:173px;
    border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,.06);
    background:#000; z-index:6; box-shadow:0 8px 30px rgba(0,0,0,.5); opacity:.94;
    transition:opacity .4s;}
  .cam video{width:100%; height:100%; object-fit:fill; transform:scaleX(-1);}
  .cam canvas{position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1);}
  .cam-label{position:absolute; left:9px; top:7px; font-family:var(--sans); font-size:9px;
    letter-spacing:.2em; color:rgba(255,255,255,.42); background:rgba(0,0,0,.30);
    padding:2px 7px; border-radius:999px;}
  .cam.hide{display:none;}

  /* ============ 底栏：一行淡字，如画下裱边 ============ */
  .bar{position:fixed; left:0; right:0; bottom:0; height:46px; z-index:6;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:0 clamp(24px,5vw,92px);
    border-top:1px solid rgba(255,255,255,.045);
    font-size:10px; letter-spacing:.22em; color:rgba(232,243,241,.26);}
  .bar .dot{display:inline-block; width:5px; height:5px; border-radius:50%; margin-right:9px;
    background:rgba(127,214,196,.55); vertical-align:middle;}
  .bar .dot.off{background:rgba(255,158,196,.45);}
  .bar-r{display:flex; align-items:center; gap:16px;}
  .bar .num{color:rgba(232,243,241,.18); font-variant-numeric:tabular-nums;}

  /* ============ 首屏：轻触唤醒 ============ */
  .gate{position:fixed; inset:0; z-index:30; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(16px,2.6vh,28px);
    background:radial-gradient(120% 120% at 50% 30%, #10313a 0%, #0a1a20 46%, #05080a 100%);
    transition:opacity .65s ease; }
  .gate.hide{opacity:0; pointer-events:none;}
  .gate .g-line{width:1px; height:clamp(30px,5vh,54px);
    background:linear-gradient(180deg, rgba(238,247,244,0), rgba(238,247,244,.34));}
  .gate .g-t{font-family:var(--serif); font-size:clamp(24px,2.9vw,38px);
    letter-spacing:.44em; color:rgba(240,249,246,.86); text-shadow:var(--shadow);
    padding-left:.44em;}
  .gate .g-s{font-family:var(--sans); font-size:10px; letter-spacing:.40em;
    text-transform:uppercase; color:rgba(238,247,244,.30);}
  .gate .g-note{font-family:var(--kai); font-size:12px; letter-spacing:.26em;
    color:rgba(238,247,244,.28); margin-top:2px;}
  .gate .g-btn{margin-top:clamp(10px,2vh,20px); padding:11px 26px; border-radius:999px;
    border:1px solid rgba(127,214,196,.32); background:rgba(127,214,196,.06);
    font-family:var(--sans); font-size:11px; letter-spacing:.30em; color:rgba(200,240,232,.82);
    transition:background .3s, border-color .3s; display:none;}
  .gate.err .g-btn{display:inline-block;}
  .gate .g-err{max-width:min(78vw,520px); text-align:center; font-family:var(--kai);
    font-size:12.5px; letter-spacing:.16em; line-height:2; color:rgba(255,180,190,.72);
    display:none;}
  .gate.err .g-err{display:block;}
  .gate.err .g-note{display:none;}

  /* 加载条（模型下载进度） */
  .prog{width:min(46vw,260px); height:1px; background:rgba(255,255,255,.10); position:relative;
    overflow:hidden; margin-top:4px;}
  .prog i{position:absolute; left:0; top:0; bottom:0; width:0%;
    background:linear-gradient(90deg, rgba(127,214,196,.5), rgba(127,214,196,.9));
    transition:width .3s;}

  /* ============ 窄屏：题款收起为横排 ============ */
  @media (max-width:1100px){
    .flower-wrap{height:min(62vh, max(190px, calc((100vw - 48px) * 0.5625))); max-height:62vh;}
    .side-left{left:18px; top:auto; bottom:74px; transform:none; max-width:none;}
    .kicker{margin-bottom:9px;}
    .kicker i{width:18px;}
    .kicker span{font-size:8.5px; letter-spacing:.3em;}
    .poem{font-size:clamp(22px,4.6vw,30px); line-height:1.5; letter-spacing:.10em;}
    .poem .l{display:inline;}
    .poem .l + .l{margin-inline-start:.42em;}
    .poem-sub{font-size:10.5px; letter-spacing:.20em; margin-top:8px;}
    .seal{display:none;}
    .side-right{display:none;}
    .cam{width:136px; height:102px; right:12px; bottom:64px;}
    .brand{font-size:12.5px; letter-spacing:.2em;}
  }
  @media (max-width:640px){
    .bar{height:40px; font-size:9px; letter-spacing:.14em;}
    .bar .num{display:none;}
    .cam{width:112px; height:84px; bottom:52px;}
  }
</style>
</head>
<body>

  <div class="brand">指尖花开<small>GESTURE · BLOOM</small></div>

  <!-- 左：题款（细线小标 · 大字题句 · 小字 · 朱印） -->
  <div class="side-left">
    <div class="kicker"><i></i><span>荷 &nbsp;·&nbsp; LOTUS / 01</span></div>
    <div class="poem"><span class="l">指间藏露</span><span class="l">掌上生莲</span></div>
    <div class="poem-sub">用手指，唤一朵荷开</div>
    <div class="seal">莲</div>
  </div>

  <!-- 右：题识（序号 · 中文名 · 英文名 · 寓意） -->
  <div class="side-right">
    <div class="r-idx">01</div>
    <div class="r-cn">荷花</div>
    <div class="r-en">Lotus</div>
    <div class="r-lat">Nelumbo nucifera</div>
    <div class="r-rule"></div>
    <div class="r-label">Flower Language</div>
    <div class="r-mean">出淤泥而不染<br>濯清涟而不妖</div>
    <div class="r-tags">清净 · 坚贞 · 吉祥</div>
  </div>

  <div class="stage">
    <div class="flower-wrap">
      <canvas id="flowerCanvas" width="1440" height="810"></canvas>
      <video id="flowerFallback" playsinline muted preload="auto"></video>
      <div class="vignette"></div>
    </div>
  </div>

  <div class="cam hide" id="camBox">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="overlay" width="640" height="480"></canvas>
    <div class="cam-label">你的手</div>
  </div>

  <div class="bar">
    <div id="barLeft">捏合手指，控制花朵开合</div>
    <div class="bar-r">
      <div id="barState"><span class="dot off" id="dot"></span><span id="barStateText">待唤醒</span></div>
      <div class="num" id="barNum">0%</div>
    </div>
  </div>

  <!-- 首屏：轻触唤醒 -->
  <div class="gate" id="gate">
    <div class="g-line"></div>
    <div class="g-t">轻触唤醒</div>
    <div class="g-s">Enable Camera</div>
    <div class="g-err" id="gateErr"></div>
    <div class="prog" id="prog" style="display:none"><i id="progBar"></i></div>
    <div class="g-note" id="gateNote">点击屏幕任意处开始 · 画面只在本机处理，不上传</div>
    <button class="g-btn" id="gateBtn">重新授权</button>
  </div>

  <!-- 手部识别模型（MediaPipe tasks-vision HandLandmarker，本地离线版） -->
  <script type="module">
    import { HandLandmarker, FilesetResolver } from "./vision_bundle.js";
    window.HandLandmarker = HandLandmarker;
    window.FilesetResolver = FilesetResolver;
  </script>

  <script>
  "use strict";

  // ===================== 元素 =====================
  const canvas    = document.getElementById('flowerCanvas');
  const ctx       = canvas.getContext('2d', { alpha: false });
  const videoFB   = document.getElementById('flowerFallback');
  const cam       = document.getElementById('cam');
  const overlay   = document.getElementById('overlay');
  const octx      = overlay.getContext('2d');
  const camBox    = document.getElementById('camBox');
  const gate      = document.getElementById('gate');
  const gateErr   = document.getElementById('gateErr');
  const gateNote  = document.getElementById('gateNote');
  const gateBtn   = document.getElementById('gateBtn');
  const prog      = document.getElementById('prog');
  const progBar   = document.getElementById('progBar');
  const barLeft   = document.getElementById('barLeft');
  const barStateText = document.getElementById('barStateText');
  const barNum    = document.getElementById('barNum');
  const dot       = document.getElementById('dot');

  // ===================== 状态 =====================
  const FRAME_COUNT = 192;
  const frames = new Array(FRAME_COUNT);
  let frameLoaded = 0;
  let mode = 'frames';
  let ready = false;
  let duration = 0;
  let lastT = -1;

  let targetOpen = 0;
  let smoothOpen = 0;
  let camOk = false;
  let started = false;
  let modelDone = false;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // 捏合比 → 张开度（量程放宽 + 两端死区，已降灵敏）
  const PINCH_MIN = 0.32, PINCH_MAX = 1.62;
  const pinchToOpen = r => {
    const t = (r - PINCH_MIN) / (PINCH_MAX - PINCH_MIN);
    return t <= 0 ? 0 : t >= 1 ? 1 : t;
  };
  const MAX_RATE = 1.35;

  const frameSrc = i => 'frames/f_' + String(i + 1).padStart(3, '0') + '.webp';

  // ===================== 逐帧图（限并发 + 首帧优先）=====================
  function preloadFrames(){
    const order = [];
    for (let i = 0; i < 24; i++) order.push(i);          // 前 24 帧先来，开场即刻可见
    for (let i = 24; i < FRAME_COUNT; i++) order.push(i);

    let ptr = 0, active = 0, done = 0;
    const MAXP = window.innerWidth > 900 ? 8 : 5;

    function pump(){
      while (active < MAXP && ptr < FRAME_COUNT){
        load(order[ptr++]); active++;
      }
    }
    function load(i){
      const img = new Image();
      img.decoding = 'async';
      img.onload  = () => fin(i, true);
      img.onerror = () => fin(i, false);
      img.src = frameSrc(i);
      frames[i] = img;
    }
    function fin(i, ok){
      active--; done++;
      if (ok) frameLoaded++;
      if (i === 0 && ok && !ready){ ready = true; drawIdx(0, true); }
      if (i === 0 && !ok){ fallbackToVideo(); }
      if (done === FRAME_COUNT && frameLoaded === 0) fallbackToVideo();
      pump();
    }
    pump();
  }

  let lastDrawnIdx = -1;
  function drawIdx(idx, force){
    if (mode !== 'frames') return;
    if (!force && idx === lastDrawnIdx) return;
    let j = idx;
    while (j > 0 && !(frames[j] && frames[j].complete && frames[j].naturalWidth)) j--;
    const img = frames[j];
    if (!img || !img.complete || !img.naturalWidth) return;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    lastDrawnIdx = (j === idx) ? idx : -1;
  }

  function fallbackToVideo(){
    if (mode === 'video') return;
    mode = 'video';
    canvas.style.display = 'none';
    videoFB.style.display = 'block';
    videoFB.src = 'lotus-bloom.mp4';
    videoFB.addEventListener('loadedmetadata', () => {
      duration = videoFB.duration || 0;
      ready = true;
      videoFB.play().then(() => { videoFB.pause(); videoFB.currentTime = 0; }).catch(() => {});
    }, { once: true });
  }

  // ===================== 渲染主循环 =====================
  let prevNow = performance.now();
  let lastHint = '';

  function loop(){
    const now = performance.now();
    let dt = (now - prevNow) / 1000;
    prevNow = now;
    if (dt > 0.12) dt = 0.12;
    if (dt <= 0) dt = 0.016;

    if (ready){
      const err = targetOpen - smoothOpen;
      const tau = Math.abs(err) > 0.10 ? 0.048 : 0.100;
      let step = err * (1 - Math.exp(-dt / tau));
      const lim = MAX_RATE * dt;
      if (step >  lim) step =  lim;
      if (step < -lim) step = -lim;
      smoothOpen += step;
      if (Math.abs(targetOpen - smoothOpen) < 0.004) smoothOpen = targetOpen;

      if (mode === 'frames'){
        drawIdx(Math.round(smoothOpen * (FRAME_COUNT - 1)));
      } else if (duration > 0){
        const t = smoothOpen * duration;
        if (Math.abs(t - lastT) > 0.012){ videoFB.currentTime = t; lastT = t; }
      }

      const h = smoothOpen < 0.08 ? 'h0' : smoothOpen > 0.92 ? 'h1' : 'h2';
      if (h !== lastHint && camOk){ lastHint = h; setHint(smoothOpen); }
      barNum.textContent = (smoothOpen * 100).toFixed(0) + '%';
    }
    requestAnimationFrame(loop);
  }

  function setHint(open){
    if (open < 0.08)      barLeft.textContent = '花苞 · 拇指食指捏紧';
    else if (open > 0.92) barLeft.textContent = '盛放 · 拇指食指张开';
    else                  barLeft.textContent = '绽放中 · 随指尖开合';
  }

  function setState(text, on){
    barStateText.textContent = text;
    dot.className = 'dot' + (on ? '' : ' off');
  }

  // ===================== 手势识别 =====================
  const HAND_CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
  ];

  function drawHand(lm){
    const W = overlay.width, H = overlay.height;
    octx.clearRect(0, 0, W, H);
    octx.strokeStyle = 'rgba(127,214,196,.85)'; octx.lineWidth = 2;
    for (let k = 0; k < HAND_CONNECTIONS.length; k++){
      const a = HAND_CONNECTIONS[k][0], b = HAND_CONNECTIONS[k][1];
      octx.beginPath();
      octx.moveTo(lm[a].x * W, lm[a].y * H);
      octx.lineTo(lm[b].x * W, lm[b].y * H);
      octx.stroke();
    }
    octx.fillStyle = 'rgba(255,158,196,.9)';
    for (let k = 0; k < lm.length; k++){
      octx.beginPath();
      octx.arc(lm[k].x * W, lm[k].y * H, 2.6, 0, Math.PI * 2);
      octx.fill();
    }
  }

  let ratioSmooth = null;
  let lastStateAt = 0;
  let missingFrames = 0;
  let hintIsMissing = false;

  function handleResults(res, detectMs){
    const handsFound = res.landmarks && res.landmarks.length > 0;
    const now = performance.now();
    if (handsFound){
      missingFrames = 0;
      const lm = res.landmarks[0];
      drawHand(lm);
      const dx = lm[4].x - lm[8].x, dy = lm[4].y - lm[8].y;
      const dist = Math.hypot(dx, dy);
      const sx = lm[0].x - lm[9].x, sy = lm[0].y - lm[9].y;
      const scale = Math.hypot(sx, sy) || 1e-6;
      const ratio = dist / scale;
      ratioSmooth = (ratioSmooth === null) ? ratio : ratioSmooth + 0.34 * (ratio - ratioSmooth);
      targetOpen = pinchToOpen(ratioSmooth);
      detMsSmooth = detMsSmooth * 0.8 + (detectMs || 0) * 0.2;
      if (hintIsMissing){ hintIsMissing = false; lastHint = ''; setHint(smoothOpen); }
      setState('识别中', true);
    } else {
      missingFrames++;
      octx.clearRect(0, 0, overlay.width, overlay.height);
      if (missingFrames > 12 && now - lastStateAt > 400){
        lastStateAt = now;
        hintIsMissing = true;
        setState('未检测到手', false);
        barLeft.textContent = '请把手放入右下小窗';
      }
    }
  }

  let handLandmarker = null;
  let lastVideoTime = -1;
  let lastDetectAt = 0;
  let detMsSmooth = 0;

  function detectLoop(ts){
    requestAnimationFrame(detectLoop);          // 先续命：模型未就绪也不会断链
    if (!handLandmarker || !camOk) return;
    const interval = detMsSmooth > 24 ? 46 : (detMsSmooth > 16 ? 36 : 28);
    if (cam.readyState >= 2 && cam.videoWidth > 0 &&
        cam.currentTime !== lastVideoTime && (ts - lastDetectAt) >= interval){
      lastDetectAt = ts;
      lastVideoTime = cam.currentTime;
      const t0 = performance.now();
      try {
        const res = handLandmarker.detectForVideo(cam, ts);
        handleResults(res, performance.now() - t0);
      } catch (e){
        console.warn('[手势] 检测异常：', e);
      }
    }
  }

  // ===================== 模型加载（带进度，不阻塞摄像头）=====================
  async function fetchWithProgress(url, onProgress){
    const res = await fetch(url, { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = Number(res.headers.get('content-length') || 0);
    if (!res.body || !total) return new Uint8Array(await res.arrayBuffer());
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for (;;){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      onProgress(got / total);
    }
    const out = new Uint8Array(got);
    let off = 0;
    for (const c of chunks){ out.set(c, off); off += c.length; }
    onProgress(1);
    return out;
  }

  async function bootModel(){
    if (typeof window.HandLandmarker === 'undefined' || typeof window.FilesetResolver === 'undefined'){
      setState('模型未载入', false);
      return false;
    }
    let vision;
    try {
      vision = await window.FilesetResolver.forVisionTasks("./wasm");
    } catch (e){
      setState('识别库载入失败', false);
      return false;
    }

    let buf = null;
    try {
      buf = await fetchWithProgress('./hand_landmarker.task', p => {
        prog.style.display = 'block';
        progBar.style.width = Math.round(p * 100) + '%';
        if (!started) gateNote.textContent = '正在载入识别模型 ' + Math.round(p * 100) + '%';
        setState('载入模型 ' + Math.round(p * 100) + '%', false);
      });
    } catch (e){
      console.warn('[手势] 模型直取失败，改用内置路径', e);
    }

    const bases = [];
    if (buf) bases.push({ modelAssetBuffer: buf });
    bases.push({ modelAssetPath: './hand_landmarker.task' });

    for (const b of bases){
      for (const delegate of ['GPU', 'CPU']){
        try {
          handLandmarker = await window.HandLandmarker.createFromOptions(vision, {
            baseOptions: Object.assign({ delegate }, b),
            runningMode: 'VIDEO',
            numHands: 1
          });
          console.log('[手势] 模型加载成功：', delegate);
          break;
        } catch (e){
          console.warn('[手势] 加载失败(' + delegate + ')', e);
        }
      }
      if (handLandmarker) break;
    }

    prog.style.display = 'none';
    modelDone = true;
    if (!handLandmarker){
      setState('手势不可用', false);
      barLeft.textContent = '模型未就绪 · 可拖动花朵或滚轮演示';
      return false;
    }
    if (camOk) setState('识别中', true);
    return true;
  }

  // ===================== 摄像头（先行，不等模型）=====================
  function camErrText(e){
    const n = (e && e.name) || '';
    if (n === 'NotAllowedError' || n === 'PermissionDeniedError')
      return '摄像头权限被拒绝<br>请点浏览器地址栏左侧的摄像头图标，改为「允许」，再点下方按钮重试';
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError')
      return '未找到摄像头设备<br>请确认摄像头已连接、未被禁用';
    if (n === 'NotReadableError' || n === 'TrackStartError')
      return '摄像头被其他程序占用<br>请关闭视频会议 / 直播软件，或关掉其他占用摄像头的标签页后重试';
    if (n === 'SecurityError')
      return '浏览器出于安全限制拒绝访问<br>请用 https 开头的地址打开本页';
    if (n === 'OverconstrainedError') return '摄像头不支持所需分辨率';
    return '摄像头未能启动（' + (n || '未知错误') + '）<br>请点下方按钮重试';
  }

  async function startCamera(){
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      showGateErr('此浏览器不支持摄像头接口<br>建议用 Edge 或 Chrome 打开');
      return false;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30, max: 30 } },
        audio: false
      });
      cam.srcObject = stream;
      await cam.play();
      camOk = true;
      camBox.classList.remove('hide');
      setState('摄像头已开', true);
      setHint(smoothOpen);
      return true;
    } catch (e){
      console.warn('[摄像头]', e);
      showGateErr(camErrText(e));
      camOk = false;
      return false;
    }
  }

  function showGateErr(html){
    gate.classList.remove('hide');
    gate.classList.add('err');
    gateErr.innerHTML = html;
    gateNote.style.display = 'none';
    setState('摄像头未开', false);
    barLeft.textContent = '点击「重新授权」启用摄像头';
  }

  // ===================== 启动（一次点击，两路并行）=====================
  async function start(){
    if (started) return;
    started = true;
    gate.classList.remove('err');
    gate.classList.add('hide');
    camBox.classList.remove('hide');           // 先占位，出画即见

    startCamera();                              // ① 摄像头不等模型，立刻请求
    requestAnimationFrame(detectLoop);
    bootModel();                                // ② 模型后台下载
  }

  gate.addEventListener('click', e => {
    if (e.target === gateBtn || !started) { start(); return; }
    if (gate.classList.contains('err')) start();
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && !started) start();
  });

  // 摄像头不可用时的兜底演示：拖动 / 滚轮
  let dragY = null, dragOpen = 0;
  canvas.style.cursor = 'grab';
  canvas.addEventListener('pointerdown', e => {
    if (camOk) return;
    dragY = e.clientY; dragOpen = targetOpen; canvas.style.cursor = 'grabbing';
  });
  window.addEventListener('pointermove', e => {
    if (camOk || dragY === null) return;
    targetOpen = clamp(dragOpen - (e.clientY - dragY) / 320, 0, 1);
  });
  window.addEventListener('pointerup', () => {
    dragY = null; canvas.style.cursor = camOk ? 'default' : 'grab';
  });
  window.addEventListener('wheel', e => {
    if (camOk) return;
    targetOpen = clamp(targetOpen - e.deltaY / 1400, 0, 1);
  }, { passive: true });

  // ===================== 启动画面 =====================
  requestAnimationFrame(loop);
  preloadFrames();

  window.addEventListener('load', () => {
    const isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    if (!(location.protocol === 'https:' || (location.protocol === 'http:' && isLocal))){
      showGateErr('此页面需用 https 打开<br>当前地址：' + location.protocol);
    }
  });
  </script>
</body>
